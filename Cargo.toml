[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.dependencies]
alacritty_terminal = { version = "0.26.0", default-features = false }

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
