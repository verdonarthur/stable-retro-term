[general]
live_config_reload = false

[window]
dimensions = { columns = 100, lines = 26 }
padding = { x = 0, y = 0 }
dynamic_padding = false

[scrolling]
history = 10000

[font]
normal = { family = "Source Code Pro", style = "Regular" }
size = 10.5
offset = { x = 0, y = 1 }

[cursor]
style = { shape = "Block", blinking = "Off" }
blink_interval = 500
blink_timeout = 0
unfocused_hollow = true

[env]
TERM = "xterm-256color"
COLORTERM = "truecolor"
