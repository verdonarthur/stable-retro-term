# Pinned retro-term configuration for --candidate-animated performance runs.
# Every key is at its default, except the experimental animated CRT preset.
preset = "animated-crt"

[effects]
crt = true
animation = true

[font]
family = ""
size = 14
line_height = 19

[terminal]
scrollback_lines = 10000

[shell]
program = ""
args = []
working_directory = ""
