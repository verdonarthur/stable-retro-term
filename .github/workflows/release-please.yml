name: Release Please

# Maintains the release PR. After a release PR merge it creates the tag and draft release,
# then calls release.yml for that exact tag and commit. Inactive until RETRO_RELEASE_ENABLED is true.
on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: release-please
    if: vars.RETRO_RELEASE_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - id: token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  release:
    name: release
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    # A called workflow cannot exceed these permissions; only its publish job keeps write access.
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml # zizmor: ignore[self-repository] actionlint 1.7.12 rejects the $/ syntax
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
      sha: ${{ needs.release-please.outputs.sha }}
      dry_run: false
      # Push-triggered releases never override the performance gate.
      allow_failed_gate: false
